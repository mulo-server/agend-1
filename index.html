<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agend-1 - Pianificazione Attività</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Top Header -->
    <header class="top-header">
      <div class="brand">
        <div class="brand-logo">
          <div class="brand-bar"></div>
          <div class="brand-bar"></div>
          <div class="brand-bar"></div>
          <div class="brand-bar"></div>
        </div>
        <span class="brand-title">Agend-1</span>
      </div>
      <div class="header-status">
        <div class="led-indicator" id="statusLed" title="Stato del salvataggio"></div>
        <span id="statusText">Pronto</span>
        <button class="btn btn-sm" id="btnOpenCategoryManager">🏷️ Gestione Categorie</button>
        <button class="btn btn-sm" id="btnOpenTemplateManager">⚙️ Gestione Template</button>
      </div>
    </header>

    <!-- Main Workspace (4-Panel Grid Layout) -->
    <main class="main-workspace">
      <!-- PANNELLO SINISTRO (Attività) -->
      <section class="panel panel-activities">
        <div class="panel-header">
          <div class="title-badge">
            <span>📋</span> Attività
          </div>
          <span id="activityCount" class="status-tag">0</span>
        </div>
        <div class="activities-actions">
          <button class="btn btn-primary" style="flex:1;" id="btnCreateActivity">+ Nuova Attività</button>
          <select id="filterStatusSelect" class="input-select" style="width: auto;">
            <option value="all">Tutti gli stati</option>
            <option value="in_progress">In Corso</option>
            <option value="completed">Completata</option>
            <option value="pending">In Attesa</option>
          </select>
        </div>
        <div class="activities-actions" style="border-top: none; padding-top: 0;">
          <select id="filterCategorySelect" class="input-select" style="width: 100%;">
            <option value="all">Tutte le categorie</option>
            <!-- Rendered by JS -->
          </select>
        </div>
        <!-- Filtri rapidi: Preferite / Urgenti -->
        <div class="quick-filters">
          <button type="button" class="chip-toggle" id="toggleFavoriteFilter" title="Mostra solo le attività preferite">⭐ Preferite</button>
          <button type="button" class="chip-toggle" id="toggleUrgentFilter" title="Mostra solo le attività urgenti">🔥 Urgenti</button>
        </div>
        <!-- Ricerca attività: posizionata sotto i filtri per dare priorità visiva a stato/categoria -->
        <div class="search-box">
          <input type="text" id="searchActivityInput" class="input-text" placeholder="🔍 Cerca attività...">
        </div>
        <div class="panel-body">
          <div id="activityList" class="activity-list">
            <!-- Rendered by JS -->
          </div>
        </div>
      </section>

      <!-- AREA CENTRALE (Notepad) -->
      <section class="panel panel-notepad">
        <div class="panel-header">
          <div class="title-badge" style="flex: 1; align-items: center; gap: 8px;">
            <span>📝</span>
            <input type="text" id="activityTitleInput" class="input-text activity-title-edit" placeholder="Titolo Attività..." disabled maxlength="120">
            <select id="activityCategorySelect" class="input-select" style="padding: 2px 6px; font-size: 10px; font-weight: bold;">
              <option value="">Nessuna categoria</option>
              <!-- Rendered by JS -->
            </select>
            <select id="activityStatusSelect" class="input-select" style="padding: 2px 6px; font-size: 10px; font-weight: bold;" disabled>
              <option value="in_progress">🔵 In Corso</option>
              <option value="completed">🟢 Completata</option>
              <option value="pending">🟡 In Attesa</option>
            </select>
          </div>
        </div>
        <!-- Notepad Multi-Page Tabs -->
        <div class="notepad-tabs-bar" id="notepadTabsContainer">
          <!-- Rendered by JS -->
        </div>
        <!-- WYSIWYG Toolbar -->
        <div class="editor-toolbar" id="editorToolbar">
          <div class="toolbar-group">
            <button class="tool-btn" data-command="formatBlock" data-value="H1" title="Titolo 1">H1</button>
            <button class="tool-btn" data-command="formatBlock" data-value="H2" title="Titolo 2">H2</button>
            <button class="tool-btn" data-command="formatBlock" data-value="H3" title="Titolo 3">H3</button>
            <button class="tool-btn" data-command="formatBlock" data-value="P" title="Paragrafo">P</button>
          </div>
          <div class="toolbar-separator"></div>
          <div class="toolbar-group">
            <button class="tool-btn" data-command="bold" title="Grassetto (Ctrl+B)"><b>B</b></button>
            <button class="tool-btn" data-command="italic" title="Corsivo (Ctrl+I)"><i>I</i></button>
            <button class="tool-btn" data-command="underline" title="Sottolineato (Ctrl+U)"><u>U</u></button>
            <button class="tool-btn" data-command="strikeThrough" title="Barrato"><s>S</s></button>
          </div>
          <div class="toolbar-separator"></div>
          <div class="toolbar-group">
            <button class="tool-btn" data-command="insertUnorderedList" title="Elenco puntato">• Lista</button>
            <button class="tool-btn" data-command="insertOrderedList" title="Elenco numerato">1. Lista</button>
          </div>
          <div class="toolbar-separator"></div>
          <div class="toolbar-group">
            <button class="tool-btn" data-command="justifyLeft" title="Allinea a sinistra">⇐</button>
            <button class="tool-btn" data-command="justifyCenter" title="Allinea al centro">⇔</button>
            <button class="tool-btn" data-command="justifyRight" title="Allinea a destra">⇒</button>
          </div>
          <div class="toolbar-separator"></div>
          <div class="toolbar-group">
            <button class="tool-btn" data-command="formatBlock" data-value="BLOCKQUOTE" title="Citazione">❝❞</button>
            <button class="tool-btn" data-command="outdent" title="Riduci Rientro">⇤</button>
            <button class="tool-btn" data-command="indent" title="Aumenta Rientro">⇥</button>
          </div>
          <div class="toolbar-separator"></div>
          <div class="toolbar-group">
            <button class="tool-btn" data-command="undo" title="Annulla (Ctrl+Z)">↶</button>
            <button class="tool-btn" data-command="redo" title="Ripeti (Ctrl+Y)">↷</button>
          </div>
          <div class="toolbar-separator"></div>
          <div class="toolbar-group">
            <label class="tool-btn" style="padding:0; width:26px;" title="Colore testo">
              🎨
              <input type="color" id="textColorPicker" class="color-picker-input" style="width:0; height:0; opacity:0; position:absolute;" value="#e4e4e4">
            </label>
            <label class="tool-btn" style="padding:0; width:26px;" title="Evidenziatore">
              🖊️
              <input type="color" id="highlightColorPicker" class="color-picker-input" style="width:0; height:0; opacity:0; position:absolute;" value="#2dd4bf">
            </label>
          </div>
        </div>
        <!-- WYSIWYG Content Area -->
        <div class="editor-container">
          <div id="notepadEditor" class="wysiwyg-content" contenteditable="true" spellcheck="false" placeholder="Inizia a scrivere la tua nota..."></div>
        </div>
      </section>

      <!-- PANNELLO INFERIORE (Template) -->
      <section class="panel panel-template">
        <div class="panel-header">
          <div class="title-badge">
            <span>⚙️</span> Campi Personalizzati (Template)
          </div>
        </div>
        <div class="template-selector-bar">
          <label style="font-weight: bold; color: var(--text-muted);">Template applicato:</label>
          <select id="templateSelect" class="input-select" style="max-width: 250px;">
            <option value="">🔍 Cerca Dati</option>
            <!-- Rendered by JS -->
          </select>
          <input type="text" id="templateDataSearchInput" class="input-text" placeholder="🔍 Cerca tra i campi compilati (nome o valore)..." style="flex: 1; display: none;">
        </div>
        <div class="panel-body">
          <div id="templateFieldsContainer" class="template-fields-grid">
            <!-- Dynamic fields rendered by JS -->
          </div>
        </div>
      </section>

      <!-- PANNELLO DESTRO (Files) -->
      <section class="panel panel-files">
        <div class="panel-header">
          <div class="title-badge">
            <span>📁</span> File e Percorsi
          </div>
          <button class="btn btn-sm btn-primary" id="btnAddFileField">+ File</button>
        </div>
        <div class="search-box">
          <input type="text" id="searchFileInput" class="input-text" placeholder="🔍 Cerca file...">
        </div>
        <div class="panel-body">
          <div id="filesContainer" class="files-list">
            <!-- File fields rendered by JS -->
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- MODALE GESTIONE TEMPLATE (Editor Template) -->
  <div class="modal-overlay" id="templateModal">
    <div class="modal-card">
      <div class="modal-header">
        <span>Gestione e Modifica Template</span>
        <button class="btn btn-sm btn-danger" id="btnCloseTemplateModal">✕</button>
      </div>
      <div class="modal-body">
        <div style="display: flex; gap: 10px; align-items: center;">
          <label style="font-weight: bold; min-width: 130px;">Seleziona o Crea:</label>
          <select id="modalTemplateSelector" class="input-select" style="flex:1;">
            <option value="new">+ Crea Nuovo Template</option>
            <!-- Options populated by JS -->
          </select>
          <button class="btn btn-danger btn-sm" id="btnDeleteTemplate">Elimina Template</button>
        </div>

        <div style="display: flex; flex-direction: column; gap: 4px;">
          <label style="font-weight: bold;">Nome Template:</label>
          <input type="text" id="modalTemplateNameInput" class="input-text" placeholder="Es. Progetto Cliente, Manutenzione...">
        </div>

        <div style="border-top: 1px solid var(--border-color); padding-top: 10px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <span style="font-weight: bold; text-transform: uppercase; color: var(--text-muted);">Campi del Template</span>
            <button class="btn btn-sm btn-primary" id="btnAddTemplateFieldRow">+ Aggiungi Campo</button>
          </div>
          <div style="font-size: 10px; color: var(--text-dim); margin-bottom: 6px;">Trascina la maniglia ⠿ per riordinare i campi.</div>
          <div id="modalTemplateFieldsBuilder" style="display: flex; flex-direction: column; gap: 8px;">
            <!-- Field rows generated by JS -->
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <span id="templateModalStatus" class="modal-status-text"></span>
        <div class="modal-footer-buttons">
          <button class="btn" id="btnCancelTemplateModal">Annulla</button>
          <button class="btn btn-primary" id="btnSaveTemplate">Salva Template</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODALE GESTIONE CATEGORIE -->
  <div class="modal-overlay" id="categoryModal">
    <div class="modal-card">
      <div class="modal-header">
        <span>Gestione Categorie</span>
        <button class="btn btn-sm btn-danger" id="btnCloseCategoryModal">✕</button>
      </div>
      <div class="modal-body">
        <div id="categoryManagerList" class="category-manager-list">
          <!-- Rendered by JS -->
        </div>
        <div style="border-top: 1px solid var(--border-color); padding-top: 10px; display: flex; gap: 8px; align-items: center;">
          <input type="text" id="newCategoryNameInput" class="input-text" placeholder="Nome nuova categoria..." style="flex:1;">
          <input type="color" id="newCategoryColorInput" class="color-picker-input" value="#2dd4bf" title="Colore categoria">
          <button class="btn btn-sm btn-primary" id="btnAddCategory">+ Aggiungi</button>
        </div>
      </div>
      <div class="modal-footer">
        <span id="categoryModalStatus" class="modal-status-text"></span>
        <button class="btn" id="btnCloseCategoryModalFooter">Chiudi</button>
      </div>
    </div>
  </div>

  <!-- MODALE MODIFICA PAGINA NOTEPAD (nome + colore) -->
  <div class="modal-overlay" id="pageEditModal">
    <div class="modal-card" style="width: 380px;">
      <div class="modal-header">
        <span>Modifica Pagina</span>
        <button class="btn btn-sm btn-danger" id="btnClosePageEditModal">✕</button>
      </div>
      <div class="modal-body">
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <label style="font-weight: bold;">Nome Pagina:</label>
          <input type="text" id="pageEditNameInput" class="input-text" placeholder="Es. Note Tecniche...">
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <label style="font-weight: bold;">Colore Pagina:</label>
          <div class="color-picker-row">
            <input type="color" id="pageEditColorInput" class="color-picker-input" value="#2dd4bf">
            <button class="btn btn-sm" id="btnPageEditNoColor" title="Rimuovi colore associato">Nessun Colore</button>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <span id="pageEditModalStatus" class="modal-status-text"></span>
        <div class="modal-footer-buttons">
          <button class="btn" id="btnCancelPageEditModal">Annulla</button>
          <button class="btn btn-primary" id="btnSavePageEditModal">Salva</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Hidden File Input for Native Picker -->
  <input type="file" id="nativeFileInput" style="display: none;">

  <!-- JS Modular Scripts -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
